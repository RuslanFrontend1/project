<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V&amp;V Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar: #1a2b4a;
      --sidebar-active: #2d4a7a;
      --accent: #4f7cff;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --sidebar-w: 240px;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--bg);
    }
    .login-card {
      background: var(--card); border-radius: 16px; padding: 48px 40px;
      width: 400px; max-width: 95vw;
      box-shadow: 0 8px 32px rgba(26,43,74,.12);
    }
    .login-logo {
      text-align: center; margin-bottom: 32px;
      font-size: 2rem; font-weight: 800; letter-spacing: .08em; color: var(--sidebar);
    }
    .login-logo span { color: var(--accent); }
    .login-card h2 { text-align: center; font-size: 1.1rem; color: var(--muted); font-weight: 400; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: .95rem; color: var(--text);
      background: #fff; outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; border-radius: 8px; font-size: .9rem;
      font-weight: 600; border: none; cursor: pointer; transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:hover { opacity: .88; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: .82rem; }
    .btn-full { width: 100%; justify-content: center; }
    #login-error { color: var(--danger); font-size: .85rem; margin-top: 10px; text-align: center; min-height: 1.2em; }

    /* ── App Shell ── */
    #app { display: none; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh;
      width: var(--sidebar-w); background: var(--sidebar);
      display: flex; flex-direction: column; z-index: 200;
      transition: transform .3s;
    }
    .sidebar-logo {
      padding: 28px 24px 20px;
      font-size: 1.5rem; font-weight: 800; letter-spacing: .1em;
      color: #fff; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar-logo span { color: var(--accent); }
    .sidebar-nav { flex: 1; padding: 16px 0; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px; color: rgba(255,255,255,.65);
      cursor: pointer; font-size: .92rem; font-weight: 500;
      border-left: 3px solid transparent;
      transition: background .2s, color .2s, border-color .2s;
      user-select: none;
    }
    .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-item.active { background: var(--sidebar-active); color: #fff; border-left-color: var(--accent); }
    .nav-item svg { flex-shrink: 0; }
    .nav-logout { margin-top: auto; padding: 16px 0; border-top: 1px solid rgba(255,255,255,.08); }

    /* Main area */
    .main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .topbar {
      background: var(--card); padding: 0 32px;
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 100;
    }
    .topbar-title { font-size: 1.15rem; font-weight: 700; }
    .topbar-user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .9rem;
    }
    .burger {
      display: none; background: none; border: none; cursor: pointer;
      padding: 8px; color: var(--text);
    }

    /* Content */
    .content { padding: 32px; flex: 1; }

    /* Cards */
    .card {
      background: var(--card); border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 24px;
      margin-bottom: 24px;
    }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 20px; color: var(--text); }

    /* Stat cards */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card); border-radius: 12px;
      padding: 22px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
      display: flex; flex-direction: column; gap: 8px;
    }
    .stat-label { font-size: .82rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-sparkline { margin-top: 4px; }

    /* Revenue chart */
    .chart-wrap { width: 100%; overflow: hidden; }
    .chart-wrap svg { display: block; width: 100%; }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    thead th {
      text-align: left; padding: 10px 14px; font-size: .78rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 2px solid #e9ecf3;
    }
    tbody tr { transition: background .15s; }
    tbody tr:nth-child(even) { background: #f8f9fd; }
    tbody tr:hover { background: #eef2ff; }
    tbody td { padding: 11px 14px; vertical-align: middle; border-bottom: 1px solid #f0f1f6; }

    /* Badges */
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .badge-new        { background: #dbeafe; color: var(--info); }
    .badge-processing { background: #fef3c7; color: var(--warning); }
    .badge-completed  { background: #d1fae5; color: var(--success); }
    .badge-cancelled  { background: #fee2e2; color: var(--danger); }

    /* Product list */
    .product-row td:first-child img {
      width: 48px; height: 48px; object-fit: cover; border-radius: 8px;
      border: 1px solid #e9ecf3;
    }
    .product-row .no-img {
      width: 48px; height: 48px; border-radius: 8px;
      background: var(--bg); border: 1px solid #e9ecf3;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: .7rem;
    }
    .actions { display: flex; gap: 6px; }

    /* Form grid */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 4px 0; }
    .checkbox-group label { display: flex; align-items: center; gap: 5px; font-size: .88rem; cursor: pointer; font-weight: 400; }

    /* Collapsible form */
    #product-form-wrap { display: none; }
    #product-form-wrap.open { display: block; }

    /* Status select in table */
    .status-select {
      border: 1.5px solid #e2e8f0; border-radius: 6px; padding: 4px 8px;
      font-size: .82rem; cursor: pointer; background: #fff; color: var(--text);
    }

    /* Toast */
    #toast-container {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    }
    .toast {
      background: var(--text); color: #fff; padding: 12px 20px;
      border-radius: 10px; font-size: .88rem; font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      animation: slideIn .25s ease;
      max-width: 320px;
    }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--danger); }
    .toast.warning { background: var(--warning); color: #1a1a2e; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    /* Overlay */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); z-index: 199;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main { margin-left: 0; }
      .topbar { padding: 0 16px; }
      .burger { display: flex; }
      .content { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
    }
  </style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">V<span>&</span>V</div>
    <h2>Вход в панель управления</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com" required />
      </div>
      <div class="form-group">
        <label for="login-pass">Пароль</label>
        <input type="password" id="login-pass" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full">Войти</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">V<span style="color:var(--accent)">&amp;</span>V</div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-section="dashboard">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </div>
      <div class="nav-item" data-section="products">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        Товары
      </div>
      <div class="nav-item" data-section="orders">

        Заказы
      </div>
      <div class="nav-item" data-section="bookings">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>

      </div>

      <div class="nav-item" id="logout-btn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="burger" id="burger-btn" aria-label="Меню">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title" id="page-title">Dashboard</span>

      <div class="topbar-user">

        <div class="user-avatar" id="user-avatar">A</div>

    <main class="content" id="content">
      <!-- sections rendered here -->
    </main>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="config.js"></script>
<script>
'use strict';

// ══ Config ══
const API = (window.VV_CONFIG?.apiBaseUrl ?? 'https://velvet-and-void.onrender.com').replace(/\/$/, '');
const SESSION_KEY = 'vv-session-v1';

// ══ State ══
let session = null;    // { token, refreshToken, email, ... }
let currentSection = 'dashboard';
let cachedData = { stats: null, orders: [], bookings: [], products: [] };

// ══ Session ══
function loadSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch { return null; }
}
function saveSession(s) {
  session = s;
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
}
function clearSession() {
  session = null;
  sessionStorage.removeItem(SESSION_KEY);
}

// ══ Toast ══
function toast(msg, type = 'default', duration = 3500) {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, duration);
}

// ══ Fetch with auth + auto-refresh ══
async function apiFetch(path, opts = {}) {
  const makeReq = (token) => fetch(`${API}${path}`, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`,
      ...(opts.headers || {}),
    },
  });

  let res = await makeReq(session?.token || '');

  if (res.status === 401 && session?.refreshToken) {
    // try refresh
    try {
      const rr = await fetch(`${API}/api/auth/refresh`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken: session.refreshToken }),
      });
      if (rr.ok) {
        const data = await rr.json();
        saveSession({ ...session, token: data.token || data.accessToken || session.token });
        res = await makeReq(session.token);
      } else {
        doLogout();
        return null;
      }
    } catch {
      doLogout();
      return null;
    }
  }

  return res;
}

// ══ Login ══
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      errEl.textContent = err.message || `Ошибка ${res.status}`;
      return;
    }
    const data = await res.json();
    saveSession({
      token: data.token || data.accessToken,
      refreshToken: data.refreshToken,
      email: data.email || email,
      name: data.name || data.username || email.split('@')[0],
    });
    initApp();
  } catch (err) {
    errEl.textContent = 'Нет соединения с сервером';
  }
});

// ══ App init ══
function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  const name = session.name || session.email || 'Admin';
  document.getElementById('user-name').textContent = name;
  document.getElementById('user-avatar').textContent = name[0].toUpperCase();

  loadAllData().then(() => navigate('dashboard'));
}

async function loadAllData() {
  try {
    const [statsRes, ordersRes, bookingsRes, productsRes] = await Promise.all([
      apiFetch('/api/admin/stats'),
      apiFetch('/api/admin/orders'),
      apiFetch('/api/admin/bookings'),
      apiFetch('/api/products?page=1&pageSize=100'),
    ]);

    if (statsRes?.ok)    cachedData.stats    = await statsRes.json().catch(() => null);
    if (ordersRes?.ok)   cachedData.orders   = await ordersRes.json().then(d => d.orders || d || []).catch(() => []);
    if (bookingsRes?.ok) cachedData.bookings = await bookingsRes.json().then(d => d.bookings || d || []).catch(() => []);
    if (productsRes?.ok) cachedData.products = await productsRes.json().then(d => d.products || d || []).catch(() => []);
  } catch (err) {
    toast('Ошибка загрузки данных', 'error');
  }
}

// ══ Logout ══
document.getElementById('logout-btn').addEventListener('click', doLogout);
function doLogout() {
  clearSession();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').textContent = '';
}

// ══ Navigation ══
document.querySelectorAll('.nav-item[data-section]').forEach(el => {
  el.addEventListener('click', () => {
    closeSidebar();
    navigate(el.dataset.section);
  });
});

function navigate(section) {
  currentSection = section;
  document.querySelectorAll('.nav-item[data-section]').forEach(el => {
    el.classList.toggle('active', el.dataset.section === section);
  });
  const titles = { dashboard: 'Dashboard', products: 'Товары', orders: 'Заказы', bookings: 'Записи в ателье' };
  document.getElementById('page-title').textContent = titles[section] || section;
  renderSection(section);
}

function renderSection(section) {
  const content = document.getElementById('content');
  if (section === 'dashboard')  content.innerHTML = renderDashboard();
  if (section === 'products')   content.innerHTML = renderProducts();
  if (section === 'orders')     content.innerHTML = renderOrders();
  if (section === 'bookings')   content.innerHTML = renderBookings();
  if (section === 'products')   bindProductEvents();
  if (section === 'orders')     bindOrderEvents();
}

// ══ Burger ══
document.getElementById('burger-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
});
document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ══════════════════════════════
//  DASHBOARD
// ══════════════════════════════
function sparklineSVG(values, color = '#4f7cff') {
  if (!values || values.length < 2) return '';
  const W = 100, H = 36, pad = 2;
  const mn = Math.min(...values), mx = Math.max(...values);
  const range = mx - mn || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (W - pad * 2);
    const y = H - pad - ((v - mn) / range) * (H - pad * 2);
    return `${x},${y}`;
  });
  const areaClose = `${pts[pts.length-1].split(',')[0]},${H} ${pts[0].split(',')[0]},${H}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">
    <defs><linearGradient id="sg${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".25"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${pts.join(' ')} ${areaClose}" fill="url(#sg${color.replace('#','')})" />
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function revenueChartSVG(orders) {
  const last10 = orders.slice(-10);
  if (last10.length < 2) return '<p style="color:var(--muted);text-align:center;padding:20px 0">Недостаточно данных</p>';
  const values = last10.map(o => Number(o.total || o.totalAmount || 0));
  const labels = last10.map(o => {
    const d = new Date(o.createdAt || o.date || Date.now());
    return `${d.getDate()}.${d.getMonth()+1}`;
  });
  const W = 600, H = 160, padL = 50, padR = 20, padT = 16, padB = 36;
  const mn = 0, mx = Math.max(...values, 1);
  const xs = last10.map((_, i) => padL + (i / (last10.length - 1)) * (W - padL - padR));
  const ys = values.map(v => padT + (1 - v / mx) * (H - padT - padB));
  const pts = xs.map((x, i) => `${x},${ys[i]}`);
  const areaClose = `${xs[xs.length-1]},${H-padB} ${xs[0]},${H-padB}`;

  // Y axis ticks
  let yTicks = '';
  for (let t = 0; t <= 4; t++) {
    const val = Math.round((mx / 4) * t);
    const y = padT + (1 - t/4) * (H - padT - padB);
    yTicks += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e9ecf3" stroke-width="1"/>
      <text x="${padL-6}" y="${y+4}" text-anchor="end" fill="#6b7280" font-size="10">${val >= 1000 ? Math.round(val/1000)+'k' : val}</text>`;
  }
  // X labels
  let xLabels = labels.map((l, i) =>
    `<text x="${xs[i]}" y="${H-padB+16}" text-anchor="middle" fill="#6b7280" font-size="10">${l}</text>`
  ).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </linearGradient></defs>
    ${yTicks}
    <polygon points="${pts.join(' ')} ${areaClose}" fill="url(#revGrad)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#4f7cff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${xs.map((x, i) => `<circle cx="${x}" cy="${ys[i]}" r="4" fill="#4f7cff" stroke="#fff" stroke-width="2"/>`).join('')}
    ${xLabels}
  </svg>`;
}

function statusBadge(status) {
  const map = {
    new: ['badge-new','Новый'], processing: ['badge-processing','В работе'],
    completed: ['badge-completed','Выполнен'], cancelled: ['badge-cancelled','Отменён'],
  };
  const [cls, label] = map[status] || ['badge-new', status || '—'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function renderDashboard() {
  const stats = cachedData.stats || {};
  const orders = cachedData.orders;
  const products = cachedData.products;

  const totalRevenue = orders.reduce((s, o) => s + Number(o.total || o.totalAmount || 0), 0);
  const productCount = stats.products ?? products.length;
  const orderCount   = stats.orders   ?? orders.length;
  const revenue      = stats.revenue  ?? totalRevenue;

  // sparkline data: use order amounts or fake variance
  const orderAmounts = orders.slice(-10).map(o => Number(o.total || o.totalAmount || 0));
  const sparkRevenue = orderAmounts.length >= 2 ? orderAmounts : [4,7,5,9,6,8,10,7,11,9];
  const sparkOrders  = [3,5,4,6,5,7,6,8,7,9];
  const sparkProds   = [10,10,11,12,12,13,13,14,14,productCount];

  const last5 = [...orders].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0)).slice(0,5);

  return `
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Товаров в каталоге</div>
      <div class="stat-value">${productCount}</div>
      <div class="stat-sparkline">${sparklineSVG(sparkProds,'#10b981')}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Заказов</div>
      <div class="stat-value">${orderCount}</div>
      <div class="stat-sparkline">${sparklineSVG(sparkOrders,'#4f7cff')}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Выручка (сом)</div>
      <div class="stat-value">${revenue.toLocaleString('ru-RU')}</div>
      <div class="stat-sparkline">${sparklineSVG(sparkRevenue,'#f59e0b')}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">График выручки (последние 10 заказов)</div>
    <div class="chart-wrap">${revenueChartSVG(orders)}</div>
  </div>

  <div class="card">
    <div class="card-title">Последние заказы</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Покупатель</th><th>Сумма</th><th>Статус</th><th>Дата</th>
        </tr></thead>
        <tbody>
          ${last5.length ? last5.map(o=>`<tr>
            <td>#${o.id||o._id||'—'}</td>
            <td>${escHtml(o.customer?.name || o.customerName || o.name || '—')}</td>
            <td>${Number(o.total||o.totalAmount||0).toLocaleString('ru-RU')} сом</td>
            <td>${statusBadge(o.status)}</td>
            <td>${fmtDate(o.createdAt||o.date)}</td>
          </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px">Нет заказов</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ══════════════════════════════
//  PRODUCTS
// ══════════════════════════════
function renderProducts() {
  const products = cachedData.products;
  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0">
      <span class="card-title" style="margin-bottom:0">Управление товарами</span>
      <button class="btn btn-primary btn-sm" id="toggle-product-form">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Добавить товар
      </button>
    </div>
  </div>

  <div class="card" id="product-form-wrap">
    <div class="card-title" id="product-form-title">Новый товар</div>
    <form id="product-form">
      <input type="hidden" id="product-edit-id" value="">
      <div class="form-grid">
        <div class="form-group">
          <label>Название (ru)</label>
          <input type="text" id="pf-name" placeholder="Пальто классическое" required />
        </div>
        <div class="form-group">
          <label>Цена (сом)</label>
          <input type="number" id="pf-price" placeholder="12000" min="0" required />
        </div>
        <div class="form-group full">
          <label>Описание (ru)</label>
          <textarea id="pf-desc" placeholder="Описание товара..."></textarea>
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="pf-category">
            <option value="outerwear">Верхняя одежда</option>
            <option value="suits">Костюмы</option>
            <option value="knitwear">Трикотаж</option>
          </select>
        </div>
        <div class="form-group">
          <label>Метка</label>
          <select id="pf-label">
            <option value="">Без метки</option>
            <option value="new">New</option>
            <option value="sale">Sale</option>
          </select>
        </div>
        <div class="form-group full">
          <label>URL изображения</label>
          <input type="url" id="pf-image" placeholder="https://..." />
        </div>
        <div class="form-group full">
          <label>Размеры</label>
          <div class="checkbox-group">
            ${['XS','S','M','L'].map(s=>`<label><input type="checkbox" name="pf-size" value="${s}"> ${s}</label>`).join('')}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button type="submit" class="btn btn-primary btn-sm" id="pf-submit-btn">Сохранить товар</button>
        <button type="button" class="btn btn-sm" id="pf-cancel-btn" style="background:#e9ecf3;color:var(--text)">Отмена</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-title">Список товаров</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:60px"></th>
          <th>Название</th>
          <th>Категория</th>
          <th>Цена</th>
          <th>Метка</th>
          <th>Действия</th>
        </tr></thead>
        <tbody id="products-tbody">
          ${products.length ? products.map(p => productRow(p)).join('') :
            '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Нет товаров</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

function productRow(p) {
  const catMap = { outerwear:'Верхняя одежда', suits:'Костюмы', knitwear:'Трикотаж' };
  const img = p.imageUrl || p.image || p.img || '';
  const imgHtml = img
    ? `<img src="${escHtml(img)}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="no-img">нет</div>`;
  return `<tr class="product-row" data-id="${p.id||p._id}">
    <td>${imgHtml}</td>
    <td>${escHtml(p.name?.ru || p.name || '—')}</td>
    <td>${catMap[p.category] || p.category || '—'}</td>
    <td>${Number(p.price||0).toLocaleString('ru-RU')} сом</td>
    <td>${p.label ? `<span class="badge ${p.label==='new'?'badge-new':'badge-processing'}">${p.label}</span>` : '—'}</td>
    <td>
      <div class="actions">
        <button class="btn btn-warning btn-sm edit-product-btn" data-id="${p.id||p._id}">Изменить</button>
        <button class="btn btn-danger btn-sm delete-product-btn" data-id="${p.id||p._id}">Удалить</button>
      </div>
    </td>
  </tr>`;
}

function bindProductEvents() {
  const formWrap = document.getElementById('product-form-wrap');
  const form     = document.getElementById('product-form');
  const editIdEl = document.getElementById('product-edit-id');

  document.getElementById('toggle-product-form').addEventListener('click', () => {
    editIdEl.value = '';
    form.reset();
    document.getElementById('product-form-title').textContent = 'Новый товар';
    document.getElementById('pf-submit-btn').textContent = 'Сохранить товар';
    formWrap.classList.toggle('open');
  });

  document.getElementById('pf-cancel-btn').addEventListener('click', () => {
    formWrap.classList.remove('open');
    editIdEl.value = '';
    form.reset();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = editIdEl.value;
    const sizes = [...document.querySelectorAll('input[name="pf-size"]:checked')].map(c=>c.value);
    const payload = {
      name: { ru: document.getElementById('pf-name').value },
      description: { ru: document.getElementById('pf-desc').value },
      price: Number(document.getElementById('pf-price').value),
      category: document.getElementById('pf-category').value,
      label: document.getElementById('pf-label').value || null,
      imageUrl: document.getElementById('pf-image').value || null,
      sizes,
    };
    const url    = id ? `/api/products/${id}` : '/api/products';
    const method = id ? 'PATCH' : 'POST';
    const res = await apiFetch(url, { method, body: JSON.stringify(payload) });
    if (res?.ok) {
      toast(id ? 'Товар обновлён' : 'Товар добавлен', 'success');
      formWrap.classList.remove('open');
      form.reset();
      editIdEl.value = '';
      await reloadProducts();
    } else {
      const err = await res?.json().catch(() => ({}));
      toast(err.message || 'Ошибка сохранения', 'error');
    }
  });

  // Edit buttons
  document.getElementById('products-tbody').addEventListener('click', async (e) => {
    const editBtn   = e.target.closest('.edit-product-btn');
    const deleteBtn = e.target.closest('.delete-product-btn');

    if (editBtn) {
      const id = editBtn.dataset.id;
      const p  = cachedData.products.find(x => String(x.id||x._id) === String(id));
      if (!p) return;
      editIdEl.value = id;
      document.getElementById('pf-name').value     = p.name?.ru || p.name || '';
      document.getElementById('pf-desc').value     = p.description?.ru || p.description || '';
      document.getElementById('pf-price').value    = p.price || '';
      document.getElementById('pf-category').value = p.category || 'outerwear';
      document.getElementById('pf-label').value    = p.label || '';
      document.getElementById('pf-image').value    = p.imageUrl || p.image || '';
      document.querySelectorAll('input[name="pf-size"]').forEach(cb => {
        cb.checked = (p.sizes || []).includes(cb.value);
      });
      document.getElementById('product-form-title').textContent = 'Редактировать товар';
      document.getElementById('pf-submit-btn').textContent = 'Обновить товар';
      formWrap.classList.add('open');
      formWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      if (!confirm('Удалить товар? Это действие нельзя отменить.')) return;
      const res = await apiFetch(`/api/products/${id}`, { method: 'DELETE' });
      if (res?.ok || res?.status === 204) {
        toast('Товар удалён', 'success');
        await reloadProducts();
      } else {
        toast('Ошибка удаления', 'error');
      }
    }
  });
}

async function reloadProducts() {
  const res = await apiFetch('/api/products?page=1&pageSize=100');
  if (res?.ok) {
    const data = await res.json();
    cachedData.products = data.products || data || [];
    const tbody = document.getElementById('products-tbody');
    if (tbody) {
      tbody.innerHTML = cachedData.products.length
        ? cachedData.products.map(p => productRow(p)).join('')
        : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Нет товаров</td></tr>';
    }
  }
}

// ══════════════════════════════
//  ORDERS
// ══════════════════════════════
function renderOrders() {
  const orders = [...cachedData.orders].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  return `
  <div class="card">
    <div class="card-title">Все заказы</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th>
          <th>Покупатель</th>
          <th>Email</th>
          <th>Телефон</th>
          <th>Доставка</th>
          <th>Оплата</th>
          <th>Итого</th>
          <th>Статус</th>
          <th>Дата</th>
        </tr></thead>
        <tbody id="orders-tbody">
          ${orders.length ? orders.map(o => orderRow(o)).join('') :
            '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:24px">Нет заказов</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

function orderRow(o) {
  const id  = o.id || o._id || '—';
  const name  = escHtml(o.customer?.name  || o.customerName  || o.name  || '—');
  const email = escHtml(o.customer?.email || o.customerEmail || o.email || '—');
  const phone = escHtml(o.customer?.phone || o.customerPhone || o.phone || '—');
  const delivery = escHtml(o.deliveryMethod || o.delivery || '—');
  const payment  = escHtml(o.paymentMethod  || o.payment  || '—');
  const total = Number(o.total||o.totalAmount||0).toLocaleString('ru-RU');

  return `<tr data-order-id="${id}">
    <td>#${id}</td>
    <td>${name}</td>
    <td>${email}</td>
    <td>${phone}</td>
    <td>${delivery}</td>
    <td>${payment}</td>
    <td>${total} сом</td>
    <td>
      <select class="status-select order-status-select" data-id="${id}">
        ${['new','processing','completed','cancelled'].map(s =>
          `<option value="${s}" ${o.status===s?'selected':''}>${{new:'Новый',processing:'В работе',completed:'Выполнен',cancelled:'Отменён'}[s]}</option>`
        ).join('')}
      </select>
    </td>
    <td>${fmtDate(o.createdAt||o.date)}</td>
  </tr>`;
}

function bindOrderEvents() {
  document.getElementById('orders-tbody')?.addEventListener('change', async (e) => {
    if (!e.target.classList.contains('order-status-select')) return;
    const id     = e.target.dataset.id;
    const status = e.target.value;
    const res = await apiFetch(`/api/admin/orders/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ status }),
    });
    if (res?.ok) {
      toast('Статус обновлён', 'success');
      const order = cachedData.orders.find(o => String(o.id||o._id) === String(id));
      if (order) order.status = status;
    } else {
      toast('Ошибка обновления статуса', 'error');
    }
  });
}

// ══════════════════════════════
//  BOOKINGS
// ══════════════════════════════
function renderBookings() {
  const bookings = [...cachedData.bookings].sort((a,b)=>new Date(a.visitDate||a.date||0)-new Date(b.visitDate||b.date||0));
  return `
  <div class="card">
    <div class="card-title">Записи в ателье</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Имя</th>
          <th>Телефон</th>
          <th>Дата визита</th>
          <th>Время</th>
        </tr></thead>
        <tbody>
          ${bookings.length ? bookings.map(b => `<tr>
            <td>${escHtml(b.name || b.clientName || '—')}</td>
            <td>${escHtml(b.phone || '—')}</td>
            <td>${fmtDate(b.visitDate || b.date)}</td>
            <td>${escHtml(b.time || b.visitTime || '—')}</td>
          </tr>`).join('') :
          '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px">Нет записей</td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ══ Utils ══
function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ══ Bootstrap ══
(function boot() {
  session = loadSession();
  if (session?.token) {
    initApp();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
})();
</script>

</html>
